<mat-form-field appearance="outline" class="w-100">
  <mat-label>{{ label }}</mat-label>
  <input 
    matInput 
    [type]="type" 
    [formControl]="control" 
    [id]="id" 
    [placeholder]="placeholder"
  >
  
  @if (errorMessage) {
    <mat-error>
      {{ errorMessage }}
    </mat-error>
  }
  @if (control.pending) {
    <mat-hint>Checking...</mat-hint>
  }
</mat-form-field>
