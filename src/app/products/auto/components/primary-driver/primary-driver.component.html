<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title class="text-primary">Primary Driver</mat-card-title>
    <mat-card-subtitle>Enter details for the main driver.</mat-card-subtitle>
  </mat-card-header>
  
  <mat-card-content class="pt-3">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <app-text-input 
            [control]="$any(form.get('firstName'))" 
            label="First Name" 
            id="firstName"
            placeholder="John">
          </app-text-input>
        </div>
        
        <div class="col-12 col-md-6">
          <app-text-input 
            [control]="$any(form.get('lastName'))" 
            label="Last Name" 
            id="lastName"
            placeholder="Doe">
          </app-text-input>
        </div>

        <div class="col-12 col-md-6">
          <app-text-input 
            [control]="$any(form.get('dob'))" 
            label="Date of Birth" 
            id="dob"
            type="date">
          </app-text-input>
        </div>

        <div class="col-12 col-md-6">
          <app-text-input 
            [control]="$any(form.get('licenseNumber'))" 
            label="License Number" 
            id="licenseNumber"
            placeholder="DL-12345678">
          </app-text-input>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4 gap-3">
        <button mat-stroked-button type="button" (click)="onBack()">
          <mat-icon>arrow_back</mat-icon> Back
        </button>
        
        <button mat-flat-button color="primary" type="submit">
          Next <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
