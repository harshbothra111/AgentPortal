<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title class="text-primary">Usage & History</mat-card-title>
    <mat-card-subtitle>Tell us how you use your car.</mat-card-subtitle>
  </mat-card-header>
  
  <mat-card-content class="pt-3">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <div class="col-12">
          <app-radio-input 
            [control]="$any(form.get('primaryUse'))" 
            label="Primary Use" 
            id="primaryUse"
            [options]="usageOptions">
          </app-radio-input>
        </div>
        
        <div class="col-12 col-md-6">
          <app-text-input 
            [control]="$any(form.get('annualMileage'))" 
            label="Annual Mileage" 
            id="mileage"
            type="number"
            placeholder="e.g. 12000">
          </app-text-input>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4 gap-3">
        <button mat-stroked-button type="button" (click)="onBack()">
          <mat-icon>arrow_back</mat-icon> Back
        </button>
        
        <button mat-flat-button color="primary" type="submit">
          Next <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
