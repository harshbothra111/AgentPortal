<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title class="text-primary">Additional Drivers</mat-card-title>
    <mat-card-subtitle>Add any other drivers for this vehicle.</mat-card-subtitle>
  </mat-card-header>
  
  <mat-card-content class="pt-3">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      
      <div formArrayName="drivers">
        @for (driver of drivers.controls; track $index) {
          <mat-card appearance="outlined" class="mb-3 bg-light" [formGroupName]="$index">
            <mat-card-content class="pt-3">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mat-h3 mb-0">Driver {{ $index + 1 }}</h5>
                <button mat-icon-button color="warn" type="button" (click)="removeDriver($index)">
                  <mat-icon>delete</mat-icon>
                </button>
              </div>

              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <app-text-input 
                    [control]="$any(driver.get('firstName'))" 
                    label="First Name" 
                    [id]="'firstName' + $index"
                    placeholder="Jane">
                  </app-text-input>
                </div>
                
                <div class="col-12 col-md-6">
                  <app-text-input 
                    [control]="$any(driver.get('lastName'))" 
                    label="Last Name" 
                    [id]="'lastName' + $index"
                    placeholder="Doe">
                  </app-text-input>
                </div>

                <div class="col-12 col-md-6">
                  <app-date-input 
                    [control]="$any(driver.get('dob'))" 
                    label="Date of Birth" 
                    [id]="'dob' + $index">
                  </app-date-input>
                </div>

                <div class="col-12 col-md-6">
                  <app-text-input 
                    [control]="$any(driver.get('licenseNumber'))" 
                    label="License Number" 
                    [id]="'licenseNumber' + $index"
                    placeholder="DL-87654321">
                  </app-text-input>
                </div>
              </div>
            </mat-card-content>
          </mat-card>
        }
      </div>

      <div class="mb-4">
        <button mat-stroked-button color="primary" type="button" (click)="addDriver()">
          <mat-icon>add</mat-icon> Add Driver
        </button>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4 gap-3">
        <button mat-stroked-button type="button" (click)="onBack()">
          <mat-icon>arrow_back</mat-icon> Back
        </button>
        
        <button mat-flat-button color="primary" type="submit">
          Next <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
