<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title class="text-primary">Select Plan</mat-card-title>
    <mat-card-subtitle>Choose the coverage that fits your needs.</mat-card-subtitle>
  </mat-card-header>
  
  <mat-card-content class="pt-3">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      
      <div class="mb-4">
        <app-radio-input
          [control]="$any(form.get('planType'))"
          label="Coverage Plan"
          id="planType"
          [options]="planOptions">
        </app-radio-input>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4 gap-3">
        <button mat-stroked-button type="button" (click)="onBack()">
          <mat-icon>arrow_back</mat-icon> Back
        </button>
        
        <button mat-flat-button color="primary" type="submit">
          Next <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
